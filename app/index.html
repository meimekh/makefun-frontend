<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151f">
  <title>make.fun — live bounties</title>
  <style>
    /* Foundation */
    :root {
      color-scheme: dark;
      --bg: #10151f;
      --panel: #171f2d;
      --panel-strong: #202b3d;
      --line: #314057;
      --fg: #f4f7fb;
      --muted: #b8c7d8;
      --accent: #7ee0ad;
      --accent-bright: #a5f1c5;
      --warning: #ffc86b;
      --radius: 16px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: radial-gradient(900px 450px at 80% -10%, #203958 0%, transparent 65%), var(--bg);
      color: var(--fg);
      font-size: 16px;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration-color: #7189a7;
      text-underline-offset: 3px;
    }

    a:hover { color: var(--accent-bright); }

    button,
    input,
    select { font: inherit; }

    button { cursor: pointer; }

    h1,
    h2,
    h3,
    p { margin-top: 0; }

    h1 {
      margin-bottom: 14px;
      font-size: clamp(2rem, 5vw, 4.2rem);
      letter-spacing: -0.065em;
      line-height: 1.03;
    }

    h2 {
      font-size: clamp(1.35rem, 2.5vw, 2rem);
      letter-spacing: -0.035em;
    }

    h3 { font-size: 1.05rem; }

    .muted,
    .metadata,
    .eyebrow { color: var(--muted); }

    .eyebrow {
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .money { color: var(--accent); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Header and page frame */
    .skip {
      position: absolute;
      top: -60px;
      left: 12px;
      z-index: 4;
      padding: 9px 14px;
      border-radius: 8px;
      background: var(--accent);
      color: #07150e;
    }

    .skip:focus { top: 12px; }

    .top {
      position: sticky;
      top: 0;
      z-index: 2;
      border-bottom: 1px solid var(--line);
      background: #10151feb;
      backdrop-filter: blur(14px);
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 18px;
      max-width: 1180px;
      min-height: 68px;
      padding: 10px 22px;
      margin: auto;
    }

    .brand {
      color: var(--fg);
      font-size: 1.25rem;
      font-weight: 850;
      letter-spacing: -0.05em;
      text-decoration: none;
      white-space: nowrap;
    }

    .brand b { color: var(--accent); }

    .boardlink {
      color: var(--fg);
      font-weight: 700;
      white-space: nowrap;
    }

    .search {
      position: relative;
      width: 100%;
      max-width: 440px;
      min-height: 44px;
      margin-left: auto;
    }

    .search::before {
      position: absolute;
      top: 8px;
      left: 13px;
      color: var(--muted);
      font-size: 22px;
      content: "⌕";
    }

    .search input {
      width: 100%;
      height: 44px;
      padding: 0 14px 0 38px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: 0;
      background: #111925;
      color: var(--fg);
    }

    .search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px #7ee0ad22;
    }

    main {
      min-height: calc(100vh - 110px);
      max-width: 1180px;
      padding: clamp(24px, 4vw, 56px) 22px 76px;
      margin: auto;
    }

    footer {
      max-width: 1180px;
      padding: 20px 22px 36px;
      margin: auto;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.85rem;
    }

    /* Reusable feedback and controls */
    .hero {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 30px;
    }

    .hero p {
      max-width: 630px;
      margin: 0;
      color: var(--muted);
      font-size: 1.08rem;
    }

    .statline {
      padding-bottom: 4px;
      color: var(--accent);
      font-weight: 750;
      white-space: nowrap;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 22px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-label {
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .tabs,
    .switch {
      display: flex;
      gap: 4px;
      padding: 4px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #111925;
    }

    .tab,
    .switch button,
    .load,
    .retry,
    .colbutton {
      min-height: 36px;
      padding: 7px 11px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      white-space: nowrap;
    }

    .tab[aria-selected="true"],
    .switch button.active {
      background: var(--panel-strong);
      color: var(--fg);
    }

    .tab:focus-visible,
    .switch button:focus-visible,
    .load:focus-visible,
    .retry:focus-visible,
    .colbutton:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .empty,
    .error,
    .skeleton {
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--muted);
    }

    .error {
      border-color: #8b5555;
      color: #ffd9d9;
    }

    .retry,
    .load {
      margin-top: 12px;
      background: var(--accent);
      color: #092015;
    }

    .skeleton {
      min-height: 250px;
      background: linear-gradient(105deg, #17202d 30%, #243148 45%, #17202d 60%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
    }

    @keyframes shimmer {
      to { background-position: -200% 0; }
    }

    /* Bounty board */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
      gap: 14px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 280px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, #1b2534, #151d29);
      transition: transform 0.16s, border-color 0.16s, background 0.16s;
    }

    .card:hover,
    .card:focus-within {
      border-color: #7595b2;
      background: #1c2839;
      transform: translateY(-3px);
    }

    .card h2 {
      margin: 8px 0;
      font-size: 1.26rem;
      line-height: 1.18;
    }

    .card-title { text-decoration: none; }

    .stretched-link::after {
      position: absolute;
      z-index: 1;
      inset: 0;
      content: "";
    }

    .card p {
      display: -webkit-box;
      margin: 0 0 16px;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.93rem;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .tagrow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .chip,
    .status,
    .sponsor {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 100%;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--fg);
      font-size: 0.76rem;
      font-weight: 750;
      line-height: 1.2;
    }

    .chip { background: #111925; }

    .status {
      border-color: #4c8766;
      background: #173323;
      color: var(--accent-bright);
    }

    .status.closed {
      border-color: #8a6b30;
      background: #332915;
      color: var(--warning);
    }

    .sponsor {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding-top: 14px;
      margin-top: auto;
      border-top: 1px solid var(--line);
    }

    .metric { min-width: 0; }

    .metric b {
      display: block;
      font-size: 1.08rem;
      letter-spacing: -0.025em;
    }

    .metric small,
    .number small,
    .record small { color: var(--muted); font-weight: 700; }

    .card-action {
      position: relative;
      z-index: 2;
      align-self: flex-start;
      margin-top: 15px;
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 800;
    }

    /* Bounty detail */
    .crumb {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      margin-bottom: 16px;
      color: var(--muted);
    }

    .detailhead {
      padding-bottom: 30px;
      border-bottom: 1px solid var(--line);
    }

    .detailhead .summary {
      max-width: 800px;
      margin: 18px 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.18rem);
    }

    .titlemeta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .numbers {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 28px;
    }

    .number {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
    }

    .number b {
      display: block;
      overflow: hidden;
      font-size: clamp(1.25rem, 2.6vw, 2rem);
      letter-spacing: -0.045em;
      text-overflow: ellipsis;
    }

    .subnav {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 22px 0 18px;
      overflow: auto;
      border-bottom: 1px solid var(--line);
    }

    .subnav button {
      padding: 13px 12px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      font-weight: 800;
      white-space: nowrap;
    }

    .subnav button.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .leader {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      margin-left: auto;
      color: var(--accent);
      font-weight: 800;
      white-space: nowrap;
    }

    .prose { max-width: 800px; }

    .prose h2 { margin-top: 30px; }

    .prose h3 { margin-top: 24px; }

    /* Overview and rendered Markdown are primary reading content, never secondary metadata. */
    .prose p,
    .prose li { color: var(--fg); }

    .prose code {
      padding: 2px 5px;
      border-radius: 5px;
      background: #243248;
      color: #d5ffe5;
    }

    .prose pre {
      padding: 14px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #0b111a;
    }

    .prose pre code { padding: 0; background: transparent; }

    .prose blockquote {
      padding-left: 15px;
      margin-left: 0;
      border-left: 3px solid var(--accent);
      color: var(--fg);
    }

    .prizegrid { max-width: 680px; }

    .prizegrid table { width: 100%; border-collapse: collapse; }

    .prizegrid th,
    .prizegrid td {
      padding: 11px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }

    .prizegrid th {
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .entrylist {
      display: grid;
      max-width: 800px;
      gap: 8px;
    }

    .entry {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--panel);
    }

    .entry b,
    .solution b { display: block; }

    .entry small,
    .solution small { color: var(--muted); }

    .rank { color: var(--accent); font-weight: 900; }

    /* Leaderboard: widths are assigned from column metadata and never create a scrolling table. */
    .phase-label { display: inline-block; margin: 0 0 14px; color: var(--muted); }

    .phase {
      min-height: 40px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--fg);
    }

    .tablewrap {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    table.boardtable {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 0.92rem;
    }

    table.boardtable th,
    table.boardtable td {
      padding: 13px 14px;
      overflow-wrap: anywhere;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
      white-space: normal;
    }

    table.boardtable th {
      background: #1a2534;
      color: var(--muted);
      font-size: 0.77rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      hyphens: manual;
    }

    .colbutton {
      padding: 0;
      color: inherit;
      font-size: inherit;
      text-align: left;
      text-transform: inherit;
      white-space: normal;
    }

    .sortarrow { color: var(--accent); }

    table.boardtable tbody tr:last-child td { border-bottom: 0; }

    table.boardtable tr.house { opacity: 0.65; }

    /* Profile */
    .avatar {
      width: 48px;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--panel-strong);
      object-fit: cover;
    }

    .profilehead {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 28px;
    }

    .profilehead .avatar { width: 88px; height: 88px; }

    .profilehead h1 {
      margin-bottom: 3px;
      font-size: clamp(2rem, 4vw, 3.4rem);
    }

    .record {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin: 24px 0 34px;
    }

    .record div {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--panel);
    }

    .record b { display: block; color: var(--accent); font-size: 1.2rem; }

    .solution {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }

    .solution:last-child { border: 0; }

    .solution .score { text-align: right; white-space: nowrap; }

    /* Light palette retains 4.5:1+ secondary text and the same hierarchy. */
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --panel: #ffffff;
        --panel-strong: #edf4f7;
        --line: #c9d6e2;
        --fg: #15202b;
        --muted: #455b6d;
        --accent: #087c4a;
        --accent-bright: #075f39;
      }

      .top { background: #f8fafceb; }
      .search input, .tabs, .switch, .chip { background: #ffffff; }
      .card { background: linear-gradient(145deg, #ffffff, #f5f8fb); }
      .card:hover, .card:focus-within { background: #ffffff; }
      .status { background: #edfff4; }
      .status.closed { background: #fff7e5; }
      .tablewrap { background: #ffffff; }
      table.boardtable th { background: #edf4f7; }
      .prose code { background: #edf4f7; color: #075f39; }
      .prose pre { background: #17212d; color: #f4f7fb; }
    }

    /* Compact layouts */
    @media (max-width: 720px) {
      .bar {
        flex-wrap: wrap;
        gap: 10px;
        padding: 9px 14px;
      }

      .search { flex-basis: 100%; order: 3; max-width: none; }
      .hero { display: block; }
      .hero .statline { margin-top: 10px; }
      .control-group { align-items: flex-start; flex-direction: column; gap: 4px; }
      .numbers { grid-template-columns: 1fr; }
      .record { grid-template-columns: repeat(2, 1fr); }
      .detailhead { padding-bottom: 20px; }
      .leader { margin-left: 0; }
      .subnav { flex-wrap: wrap; overflow: visible; }
      .entry { grid-template-columns: 32px 1fr; }
      .entry > span:last-child { grid-column: 2; }
      .solution { display: block; }
      .solution .score { margin-top: 8px; text-align: left; }

      table.boardtable,
      table.boardtable tbody,
      table.boardtable tr,
      table.boardtable td { display: block; }

      table.boardtable thead { display: none; }

      table.boardtable tr {
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
      }

      table.boardtable td {
        padding: 5px 0;
        border: 0;
      }

      table.boardtable td::before {
        display: inline-block;
        width: 105px;
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 750;
        text-transform: uppercase;
        content: attr(data-label);
      }

      .tablewrap { overflow: visible; }
    }
  </style>
  <script type="module" src="main.js"></script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="top">
    <nav class="bar" aria-label="Primary">
      <a class="brand" href="#/"><b>make</b>.fun</a>
      <a class="boardlink" href="#/">Board</a>
      <label class="search">
        <span class="sr-only">Search bounties</span>
        <input id="site-search" type="search" placeholder="Search live bounties" aria-label="Search bounties" autocomplete="off">
      </label>
    </nav>
  </header>
  <main id="content" tabindex="-1" aria-live="polite"></main>
  <footer>Live public data from make.fun · Read-only, fast, and built for builders.</footer>
</body>
</html>
